server:
    port: 8080
    tomcat:
        max-connections: 8192
        threads:
            max: 200
spring:
    application:
        name: accounts
    datasource:
        url: jdbc:h2:mem:testdb
        driver-class-name: org.h2.Driver
        username: sa
        password:
    h2:
      console:
        enabled: true
    jpa:
        open-in-view: false
        database-platform: org.hibernate.dialect.H2Dialect
        hibernate:
            ddl-auto: none
        show-sql: true