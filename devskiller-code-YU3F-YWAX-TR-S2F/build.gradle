apply plugin: 'java'
apply plugin: 'groovy'

version = '1.0'

sourceCompatibility = 1.11
targetCompatibility = 1.11

repositories {
	mavenLocal()
	mavenCentral()
}

dependencies {
	testImplementation 'org.spockframework:spock-core:1.3-groovy-2.5'
	testImplementation 'org.codehaus.groovy:groovy-all:2.5.12'
}

